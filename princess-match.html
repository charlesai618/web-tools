<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6ea">
<title>Princess Match · 公主连连看</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3f1; --bg2:#e9e2ff;
  --ink:#5a2d6e; --ink2:#8a5a9e; --pink:#ff5fa2; --pink2:#ff8cc0; --gold:#ffcf3f; --lilac:#a78bfa;
  --edge:#efc3dd;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Fredoka','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
.hidden{display:none!important}

/* ── floating decorations ── */
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dc{position:absolute;bottom:-50px;color:#fff;opacity:0;animation:drift linear infinite;text-shadow:0 0 8px rgba(255,255,255,.8)}
@keyframes drift{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.75}90%{opacity:.75}100%{transform:translateY(-118vh) rotate(220deg);opacity:0}}

/* ── buttons ── */
.ib{width:44px;height:44px;border-radius:50%;border:0;background:#fff;flex:none;display:grid;place-items:center;font-size:1.25rem;
  box-shadow:0 3px 0 var(--edge),0 4px 10px rgba(120,60,140,.15);transition:transform .12s}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.ib.pill{width:auto;border-radius:22px;padding:0 16px;font-weight:600;font-size:1rem}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:1.05rem;background:var(--pink);color:#fff;box-shadow:0 4px 0 #d9468a}
.btn.alt{background:#f3eafa;color:var(--ink);box-shadow:0 4px 0 #dccbe9}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9468a}

/* ── home ── */
#home{overflow-y:auto;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
.home-top{width:100%;max-width:1000px;display:flex;justify-content:flex-end;gap:10px}
.crown{width:84px;height:84px;margin-top:-6px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
h1.title{font-size:clamp(2.1rem,7.5vw,3.6rem);font-weight:700;color:#fff;text-align:center;line-height:1.1;
  text-shadow:0 3px 0 var(--pink),0 6px 16px rgba(255,95,162,.45);letter-spacing:.5px}
.sub{color:var(--ink2);text-align:center;margin:8px 0 4px;font-size:clamp(1rem,3.6vw,1.2rem);font-weight:600}
.rule{color:var(--ink2);text-align:center;margin:0 0 18px;font-size:.88rem;max-width:560px;opacity:.85}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px;width:100%;max-width:1000px}
.lvl{position:relative;border:0;border-radius:24px;padding:14px 10px 12px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:0 5px 0 var(--edge),0 10px 22px rgba(120,60,140,.14);transition:transform .15s}
.lvl:hover{transform:translateY(-4px)}
.lvl:active{transform:translateY(2px)}
.lvl .por{width:100px;height:100px;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 4px #fff,0 0 0 3px var(--c2)}
.lvl .por svg{width:100%;height:100%;display:block}
.lvl .num{position:absolute;top:9px;left:10px;background:var(--pink);color:#fff;font-weight:700;border-radius:999px;min-width:30px;height:30px;
  display:grid;place-items:center;font-size:1rem;box-shadow:0 2px 0 #d9468a}
.lvl .size{position:absolute;top:11px;right:10px;font-size:.75rem;color:var(--ink2);background:#f6eefb;border-radius:8px;padding:2px 7px}
.lvl .nm{font-weight:700;font-size:1.08rem;margin-top:4px}
.lvl .st{color:var(--gold);letter-spacing:2px;font-size:1.15rem;text-shadow:0 1px 0 #d4a017;line-height:1}
.lvl .st .off{color:#ece2f3;text-shadow:none}
.lvl .song{font-size:.76rem;color:var(--ink2);text-align:center;line-height:1.2;min-height:1.9em}
.foot{margin-top:22px;font-size:.78rem;color:var(--ink2);opacity:.8;text-align:center;max-width:560px}

/* ── game ── */
#game .bar{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 6px}
.lvinfo{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);border-radius:24px;padding:4px 14px 4px 4px;height:44px}
.lvinfo .mini{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:#fff}
.lvinfo .mini svg{width:100%;height:100%;display:block}
.lvinfo .txt{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.lvinfo b{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvinfo small{font-size:.74rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pairs{display:flex;align-items:center;gap:4px;background:#fff;border-radius:22px;height:44px;padding:0 12px;font-weight:700;font-size:1.1rem;
  box-shadow:0 3px 0 var(--edge);flex:none}
.progress{height:8px;margin:2px 14px 0;border-radius:4px;background:rgba(255,255,255,.65);overflow:hidden;flex:none}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--lilac));border-radius:4px;transition:width .4s}
#stage{flex:1;position:relative;display:grid;place-items:center;min-height:0;padding:4px 4px max(6px,env(safe-area-inset-bottom))}
#board{position:relative}
.lv-short{display:none}
@media (max-width:440px){
  .lvinfo small,.lv-long{display:none}
  .lv-short{display:inline}
  .lvinfo{padding:0 10px 0 14px}
  .lvinfo .mini{display:none!important}
  .lvinfo b{font-size:.95rem}
  .ib{width:40px;height:40px;font-size:1.1rem}
  .pairs{height:40px;padding:0 10px}
  .lvinfo{height:40px}
  #game .bar{gap:6px;padding-left:8px;padding-right:8px}
}

/* ── tiles ── */
.tile{position:absolute;border:0;padding:.42em;border-radius:20%;background:#fff;
  box-shadow:0 .3em 0 var(--edge),0 .45em .8em rgba(110,50,130,.18);transition:transform .14s ease,box-shadow .14s}
.tile .art{display:block;width:100%;height:100%;border-radius:16%;overflow:hidden}
.tile svg{display:block;width:100%;height:100%;pointer-events:none}
.tile:hover{transform:translateY(-3%)}
.tile.sel{transform:translateY(-7%) scale(1.08);z-index:3;
  box-shadow:0 0 0 .24em var(--gold),0 0 1.1em .4em rgba(255,207,63,.9),0 .36em 0 var(--edge)}
.tile.hint{animation:hintPulse .65s ease-in-out infinite alternate;z-index:2}
@keyframes hintPulse{
  from{box-shadow:0 0 0 .16em #fff,0 0 .6em .2em rgba(255,95,162,.55),0 .3em 0 var(--edge);transform:scale(1)}
  to{box-shadow:0 0 0 .24em var(--pink),0 0 1.3em .55em rgba(255,95,162,.85),0 .3em 0 var(--edge);transform:scale(1.08)}}
.tile.wobble{animation:wobble .42s}
@keyframes wobble{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.tile.gone{animation:pop .4s ease-in .12s forwards;pointer-events:none;z-index:4;
  box-shadow:0 0 0 .24em var(--gold),0 0 1.4em .6em rgba(255,207,63,.95)}
@keyframes pop{0%{transform:scale(1.08)}35%{transform:scale(1.25);opacity:1}100%{transform:scale(0) rotate(30deg);opacity:0}}
.tile.enter{animation:enter .45s cubic-bezier(.3,1.5,.6,1) both}
@keyframes enter{from{transform:scale(0) rotate(-25deg);opacity:0}}

#paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:6}
#paths path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .2s ease-out forwards}
#paths .p1{stroke:rgba(255,207,63,.5);filter:blur(3px)}
#paths .p2{stroke:#ffc928}
#paths .p3{stroke:#fff}
#paths g{transition:opacity .35s}
#paths g.fade{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}

/* ── effects ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pt{position:absolute;transform:translate(-50%,-50%);animation:fly .85s ease-out forwards;line-height:1}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3) rotate(200deg);opacity:0}}
.namepop{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:clamp(18px,4.6vw,30px);color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 var(--pink),2px 0 0 var(--pink),-2px 0 0 var(--pink),0 -2px 0 var(--pink),0 4px 14px rgba(255,95,162,.6);animation:rise 1.2s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.cf{position:absolute;top:-24px;width:10px;height:15px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}

#toast{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top));transform:translate(-50%,-16px);background:#fff;color:var(--pink);font-weight:600;
  padding:10px 20px;border-radius:999px;box-shadow:0 6px 18px rgba(120,60,140,.22);opacity:0;transition:.3s;z-index:60;max-width:92vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ── win ── */
#win{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(255,236,248,.55);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:16px}
.wcard{background:#fff;border-radius:32px;padding:20px 22px 24px;width:min(420px,100%);text-align:center;margin-top:70px;
  box-shadow:0 8px 0 var(--edge),0 20px 50px rgba(120,60,140,.3);animation:cardIn .55s cubic-bezier(.3,1.4,.6,1)}
@keyframes cardIn{from{transform:scale(.6) translateY(40px);opacity:0}}
.wpor{width:150px;height:150px;margin:-92px auto 10px;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));
  box-shadow:0 0 0 6px #fff,0 0 0 11px var(--gold),0 10px 30px rgba(255,180,0,.45);animation:bob 2.4s ease-in-out infinite}
.wpor svg{width:100%;height:100%;display:block}
.wcard h2{font-size:1.9rem;color:var(--pink);line-height:1.15}
.wcard p{color:var(--ink2);margin:6px 0 6px;font-weight:600}
.wstars{font-size:2.8rem;letter-spacing:6px;margin:2px 0 16px}
.wstars span{display:inline-block;color:#ece2f3}
.wstars span.on{color:var(--gold);text-shadow:0 3px 0 #d4a017;animation:starIn .55s cubic-bezier(.3,1.8,.6,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-120deg)}}
.wbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.dc,.crown,.wpor{animation:none}}
</style>
</head>
<body>
<div id="decor" aria-hidden="true"></div>

<section id="home" class="screen">
  <div class="home-top">
    <button id="h-lang" class="ib pill" type="button"></button>
    <button id="h-sound" class="ib" type="button"></button>
  </div>
  <div class="crown" id="h-crown" aria-hidden="true"></div>
  <h1 class="title" id="h-title"></h1>
  <p class="sub" id="h-sub"></p>
  <p class="rule" id="h-rule"></p>
  <div class="levels" id="levels"></div>
  <p class="foot" id="h-foot"></p>
</section>

<section id="game" class="screen hidden">
  <header class="bar">
    <button id="g-home" class="ib" type="button">🏰</button>
    <div class="lvinfo"><span class="mini" id="g-mini"></span><span class="txt"><b id="g-title"></b><small id="g-song"></small></span></div>
    <div class="pairs"><span aria-hidden="true">💖</span><b id="g-left">0</b></div>
    <button id="g-hint" class="ib" type="button">💡</button>
    <button id="g-shuffle" class="ib" type="button">🔀</button>
    <button id="g-sound" class="ib" type="button"></button>
  </header>
  <div class="progress"><i id="g-prog"></i></div>
  <main id="stage"><div id="board"><svg id="paths" xmlns="http://www.w3.org/2000/svg"></svg></div></main>
</section>

<div id="win" class="hidden" role="dialog" aria-modal="true">
  <div class="wcard">
    <div class="wpor" id="w-por"></div>
    <h2 id="w-title"></h2>
    <p id="w-sub"></p>
    <div class="wstars" id="w-stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="wbtns">
      <button class="btn alt" id="w-home" type="button"></button>
      <button class="btn alt" id="w-again" type="button"></button>
      <button class="btn" id="w-next" type="button"></button>
    </div>
  </div>
</div>
<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('pmatch.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pmatch.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ═══════════════════════  TEXT  ═══════════════════════ */
let lang = store.get('lang', /^zh/i.test(navigator.language || '') ? 'zh' : 'en');
const STR = {
  en: {
    title: 'Princess Match', sub: 'Find two pictures that are the same and tap them!',
    rule: 'Any two that are the same will disappear — no matter where they are!',
    foot: 'Every level plays its own tune 🎵 — classic and folk melodies played right in your browser. Characters are original fan-art drawings.',
    level: n => 'Level ' + n, langBtn: '中文',
    win: 'Hooray! You did it!', winSub: n => n + ' says thank you!', allDone: 'You finished every level! 👑',
    next: 'Next level ▶', again: 'Play again', levels: 'All levels',
    hint: 'Hint', shuffle: 'Shuffle', home: 'All levels', pairs: 'Pairs left',
    sound: ['Sound off', 'Sound effects only', 'Music and sound on']
  },
  zh: {
    title: '公主连连看', sub: '找到两个一样的图案，点一点它们！',
    rule: '只要两个图案一样就能消除，不管它们在哪里！',
    foot: '每一关都有不同的音乐 🎵 —— 经典名曲和民歌，在浏览器里现场演奏。人物都是原创的同人画。',
    level: n => '第 ' + n + ' 关', langBtn: 'EN',
    win: '太棒啦！你完成了！', winSub: n => n + '说：谢谢你！', allDone: '全部通关啦！👑',
    next: '下一关 ▶', again: '再玩一次', levels: '选关',
    hint: '提示', shuffle: '洗牌', home: '选关', pairs: '剩余',
    sound: ['声音关闭', '只有音效', '音乐和音效']
  }
};
const t = (k, ...a) => { const v = STR[lang][k]; return typeof v === 'function' ? v(...a) : v; };

/* ═══════════════════════  ART (original drawings, 100×100)  ═══════════════════════ */
const A = {};
const ALL = [];
function def(id, en, zh, tint, svg, isP) { A[id] = { id, en, zh, tint, svg, p: !!isP }; ALL.push(id); }
const nameOf = id => A[id][lang];
const sparkle = (x, y, s, c) => `<path d="M${x} ${y - s}Q${x} ${y} ${x + s} ${y}Q${x} ${y} ${x} ${y + s}Q${x} ${y} ${x - s} ${y}Q${x} ${y} ${x} ${y - s}Z" fill="${c}"/>`;
function flower(x, y, r, pc, cc) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const a = i * 1.2566 - 1.5708;
    s += `<circle cx="${(x + Math.cos(a) * r).toFixed(1)}" cy="${(y + Math.sin(a) * r).toFixed(1)}" r="${(r * .78).toFixed(2)}" fill="${pc}"/>`;
  }
  return s + `<circle cx="${x}" cy="${y}" r="${(r * .55).toFixed(2)}" fill="${cc}"/>`;
}
const mir = s => `<g transform="matrix(-1 0 0 1 100 0)">${s}</g>`;
const braid = (pts, fill, line) => pts.map(([x, y, r]) =>
  `<ellipse cx="${x}" cy="${y}" rx="5.4" ry="4.3" transform="rotate(${r} ${x} ${y})" fill="${fill}" stroke="${line}" stroke-width="1"/>`).join('');
const TORSO = 'M17 101C17 86 30 76 50 76C70 76 83 86 83 101Z';

function face(o) {
  const b = o.blush == null ? .42 : o.blush;
  return `<ellipse cx="50" cy="47" rx="19.5" ry="20.5" fill="${o.skin}"/>` +
    `<ellipse cx="42" cy="49.5" rx="3.3" ry="4.3" fill="#2b1d1a"/><ellipse cx="58" cy="49.5" rx="3.3" ry="4.3" fill="#2b1d1a"/>` +
    `<ellipse cx="42" cy="50.7" rx="2.3" ry="2.8" fill="${o.eye}"/><ellipse cx="58" cy="50.7" rx="2.3" ry="2.8" fill="${o.eye}"/>` +
    `<circle cx="43.2" cy="48" r="1.25" fill="#fff"/><circle cx="59.2" cy="48" r="1.25" fill="#fff"/>` +
    `<circle cx="41" cy="52.3" r=".55" fill="#fff" opacity=".8"/><circle cx="57" cy="52.3" r=".55" fill="#fff" opacity=".8"/>` +
    `<path d="M38.8 46.4l-1.9-1.4M61.2 46.4l1.9-1.4" stroke="#2b1d1a" stroke-width="1" stroke-linecap="round"/>` +
    `<path d="M38.6 42.4Q42 40.8 45.4 42.2M54.6 42.2Q58 40.8 61.4 42.4" stroke="${o.brow}" stroke-width="1.25" fill="none" stroke-linecap="round"/>` +
    `<ellipse cx="37.4" cy="55.6" rx="3.2" ry="1.9" fill="#ff7f9f" opacity="${b}"/><ellipse cx="62.6" cy="55.6" rx="3.2" ry="1.9" fill="#ff7f9f" opacity="${b}"/>` +
    `<path d="M49.2 54.4Q50 55.2 50.8 54.4" stroke="#000" stroke-opacity=".22" stroke-width=".9" fill="none" stroke-linecap="round"/>` +
    `<path d="M46.8 58.2Q50 62 53.2 58.2Q50 59.4 46.8 58.2Z" fill="${o.lip}" stroke="${o.lip}" stroke-width=".7" stroke-linejoin="round"/>`;
}
function princess(o) {
  const neck = `<path d="M44.6 60V75.5Q50 78.5 55.4 75.5V60Z" fill="${o.skin}"/><path d="M44.6 63Q50 69 55.4 63V61H44.6Z" fill="#000" opacity=".07"/>`;
  const ears = o.ears ? `<ellipse cx="30.8" cy="50" rx="2.7" ry="3.7" fill="${o.skin}"/><ellipse cx="69.2" cy="50" rx="2.7" ry="3.7" fill="${o.skin}"/>` : '';
  return (o.back || '') + (o.under || '') + ears + neck + (o.body || '') + face(o) + (o.extra || '') + (o.front || '') + (o.acc || '');
}

def('snowwhite', 'Snow White', '白雪公主', '#ffe1e7', princess({
  skin: '#fde4d8', eye: '#5a3a26', brow: '#1f1b2e', lip: '#e0283c',
  back: `<path d="M27 48C25 29 37 20 50 20C63 20 75 29 73 48C74 57 72 63 67 66C62 68 38 68 33 66C28 63 26 57 27 48Z" fill="#1f1b2e"/>`,
  under: `<path d="M30 80C23 72 24 62 31 61L44 74H56L69 61C76 62 77 72 70 80Z" fill="#fff" stroke="#dfe3f2" stroke-width="1"/>`,
  body: `<path d="${TORSO}" fill="#2a5db0"/><path d="M41 76Q50 84 59 76Z" fill="#fde4d8"/>` +
    `<ellipse cx="23" cy="88" rx="10" ry="9" fill="#3b78d8"/><ellipse cx="77" cy="88" rx="10" ry="9" fill="#3b78d8"/>` +
    `<path d="M19 84Q22 89 20 95M26 81Q28 87 27 94M81 84Q78 89 80 95M74 81Q72 87 73 94" stroke="#e0283c" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
  front: `<path d="M29.5 47C29 32 39 24 51 24C63 24 71 32 70.5 47C68 39 63 34 57 32C50 36 41 39 29.5 47Z" fill="#1f1b2e"/>` +
    `<circle cx="30.5" cy="56" r="4" fill="#1f1b2e"/><circle cx="69.5" cy="56" r="4" fill="#1f1b2e"/>`,
  acc: `<g transform="translate(50 21.5)"><path d="M-1 0L-12.5-6.5Q-16 0-12.5 6.5Z" fill="#e5283b"/><path d="M1 0L12.5-6.5Q16 0 12.5 6.5Z" fill="#e5283b"/><circle r="3.3" fill="#c01b2e"/></g>`
}), true);

}
function renderHome() {
  const best = store.get('stars', {});
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $('#h-title').textContent = t('title'); $('#h-sub').textContent = t('sub'); $('#h-rule').textContent = t('rule'); $('#h-foot').textContent = t('foot');
  $('#h-lang').textContent = t('langBtn');
  $('#levels').innerHTML = LEVELS.map((L, i) => {
    const st = best[i] || 0;
    return `<button class="lvl" type="button" data-i="${i}" style="--c1:${L.bg[0]};--c2:${L.bg[1]}">` +
      `<span class="num">${i + 1}</span><span class="size">${L.cols}×${L.rows}</span>` +
      `<span class="por">${art(L.p)}</span><span class="nm">${nameOf(L.p)}</span>` +
      `<span class="st">${'★'.repeat(st)}<span class="off">${'★'.repeat(3 - st)}</span></span>` +
      `<span class="song">♪ ${songName(L.song)}</span></button>`;
  }).join('');
}
function soundIcons() {
  const ic = ['🔇', '🔔', '🎵'][SND.mode], lbl = t('sound')[SND.mode];
  for (const id of ['#h-sound', '#g-sound']) { const b = $(id); b.textContent = ic; b.title = lbl; b.setAttribute('aria-label', lbl); }
}

/* ── interaction ── */
function tileEl(p) { return els.get(key(p[0], p[1])); }
function select(p) { G.sel = p; const el = tileEl(p); if (el) el.classList.add('sel'); }
function deselect() { if (G.sel) { const el = tileEl(G.sel); if (el) el.classList.remove('sel'); } G.sel = null; }
function wobble(p) { const el = tileEl(p); if (!el) return; el.classList.remove('wobble'); void el.offsetWidth; el.classList.add('wobble'); }
function tap(r, c) {
  resetIdle(); clearHint();
  const tp = G.g[r][c]; if (!tp) return;
  const s = G.sel;
  if (!s) { select([r, c]); SND.sfx.select(); return; }
  if (s[0] === r && s[1] === c) { deselect(); SND.sfx.tap(); return; }
  if (G.g[s[0]][s[1]] !== tp) { wobble(s); deselect(); select([r, c]); SND.sfx.select(); return; }
  // Same picture = match. Draw the tidy connecting route when one exists, otherwise a straight sparkle line.
  const path = findPath(G.g, G.R, G.C, s, [r, c]) || [s, [r, c]];
  deselect();
  doMatch(s, [r, c], path, tp);
}
function doMatch(a, b, path, tp) {
  G.g[a[0]][a[1]] = null; G.g[b[0]][b[1]] = null;
  G.left--; G.matches++;
  const ea = tileEl(a), eb = tileEl(b);
  els.delete(key(a[0], a[1])); els.delete(key(b[0], b[1]));
  drawPath(path);
  [ea, eb].forEach(el => { if (!el) return; el.classList.add('gone'); setTimeout(() => { burst(el); }, 150); setTimeout(() => el.remove(), 650); });
  if (ea && eb) namePop(tp, ea, eb);
  SND.sfx.match(G.matches - 1);
  SND.say(lang, tp, nameOf(tp), .22);
  setHud();
  if (G.left === 0) { G.over = true; later('win', 800, win); }
}
function drawPath(path) {
  const d = path.map(([r, c], i) => (i ? 'L' : 'M') + px(c, G.C).toFixed(1) + ' ' + px(r, G.R).toFixed(1)).join('');
  const w = Math.max(4, G.cell * .1);
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.innerHTML = `<path class="p1" d="${d}" pathLength="1" stroke-width="${w * 2.2}"/><path class="p2" d="${d}" pathLength="1" stroke-width="${w}"/><path class="p3" d="${d}" pathLength="1" stroke-width="${w * .38}"/>`;
  paths.appendChild(g);
  setTimeout(() => g.classList.add('fade'), 300);
  setTimeout(() => g.remove(), 750);
}
function center(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2, r.width]; }
function burst(el) {
  const [x, y, w] = center(el);
  const glyphs = ['✦', '★', '♥', '✿', '✧'], colors = ['#ffcf3f', '#ff5fa2', '#a78bfa', '#5ec1ec', '#ff8cc0'];
  for (let i = 0; i < 9; i++) {
    const s = document.createElement('span');
    s.className = 'pt'; s.textContent = glyphs[rnd(5)];
    const a = Math.random() * Math.PI * 2, dist = w * (.6 + Math.random() * .8);
    s.style.cssText = `left:${x}px;top:${y}px;color:${colors[rnd(5)]};font-size:${w * .22 + 7}px;--dx:${Math.cos(a) * dist}px;--dy:${Math.sin(a) * dist}px`;
    fx.appendChild(s); setTimeout(() => s.remove(), 900);
  }
}
function namePop(tp, ea, eb) {
  const [x1, y1] = center(ea), [x2, y2] = center(eb);
  const s = document.createElement('div');
  s.className = 'namepop'; s.textContent = nameOf(tp);
  const x = Math.min(window.innerWidth - 80, Math.max(80, (x1 + x2) / 2));
  s.style.left = x + 'px'; s.style.top = ((y1 + y2) / 2) + 'px';
  fx.appendChild(s); setTimeout(() => s.remove(), 1250);
}
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  later('toast', 2200, () => el.classList.remove('show'));
}
function reshuffle() {
  const cells = [], tiles = [];
  for (let r = 1; r <= G.R; r++) for (let c = 1; c <= G.C; c++) if (G.g[r][c]) { cells.push([r, c]); tiles.push(G.g[r][c]); }
  deselect(); clearHint();
  fillCells(G.g, G.R, G.C, cells, tiles);
  SND.sfx.shuffle();
  render(true);
  G.busy = true; later('busy', 500, () => { G.busy = false; });
  resetIdle();
}
function clearHint() { clearTimeout(G.timers.hint); document.querySelectorAll('.tile.hint').forEach(e => e.classList.remove('hint')); }
function showHint(manual) {
  if (G.over || G.busy) return;
  const p = findAnyPair(G.g, G.R, G.C); if (!p) return;
  if (manual) G.hints++;
  clearHint();
  p.forEach(q => { const el = tileEl(q); if (el) el.classList.add('hint'); });
  SND.sfx.hint();
  later('hint', 3200, clearHint);
}
function resetIdle() { later('idle', 20000, () => showHint(false)); }

function win() {
  clearTimers();
  const stars = G.hints <= 1 ? 3 : G.hints <= 3 ? 2 : 1;
  const best = store.get('stars', {});
  if ((best[G.li] || 0) < stars) { best[G.li] = stars; store.set('stars', best); }
  const last = G.li === LEVELS.length - 1;
  $('#w-por').innerHTML = art(G.L.p);
  $('#w-title').textContent = last ? t('allDone') : t('win');
  $('#w-sub').textContent = t('winSub', nameOf(G.L.p));
  $('#w-home').textContent = t('levels'); $('#w-again').textContent = t('again'); $('#w-next').textContent = t('next');
  $('#w-next').classList.toggle('hidden', last);
  const sp = $('#w-stars').children;
  for (let i = 0; i < 3; i++) { sp[i].className = ''; if (i < stars) { sp[i].style.animationDelay = (.35 + i * .25) + 's'; sp[i].className = 'on'; } }
  $('#win').classList.remove('hidden');
  SND.stop(.4); SND.sfx.win(); confetti();
  later('resume', 2800, () => { if (!$('#win').classList.contains('hidden')) SND.play(G.L.song); });
}
function confetti() {
  const colors = ['#ff5fa2', '#ffcf3f', '#a78bfa', '#5ec1ec', '#7fdc8f', '#ff8cc0'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'cf';
    const dur = 2.2 + Math.random() * 1.8;
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[rnd(6)]};animation-duration:${dur}s;animation-delay:${Math.random() * .6}s;` +
      `--dx:${(Math.random() - .5) * 160}px;--rot:${(Math.random() - .5) * 1080}deg;border-radius:${Math.random() < .4 ? '50%' : '3px'}`;
    fx.appendChild(c); setTimeout(() => c.remove(), (dur + .7) * 1000);
  }
}

/* ── wiring ── */
document.addEventListener('pointerdown', () => SND.unlock(), { capture: true });
document.addEventListener('keydown', () => SND.unlock(), { capture: true });
board.addEventListener('click', e => {
  const el = e.target.closest('.tile');
  if (!el || G.over || G.busy || el.classList.contains('gone')) return;
  tap(+el.dataset.r, +el.dataset.c);
});
$('#levels').addEventListener('click', e => { const b = e.target.closest('.lvl'); if (b) { SND.sfx.tap(); startLevel(+b.dataset.i); } });
$('#g-home').addEventListener('click', () => { SND.sfx.tap(); showHome(); });
$('#g-hint').addEventListener('click', () => showHint(true));
$('#g-shuffle').addEventListener('click', () => { if (!G.over && !G.busy) reshuffle(); });
const cycleSound = () => { SND.setMode((SND.mode + 2) % 3); soundIcons(); SND.sfx.tap(); };
$('#h-sound').addEventListener('click', cycleSound);
$('#g-sound').addEventListener('click', cycleSound);
$('#h-lang').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; store.set('lang', lang); renderHome(); soundIcons(); setLevelText(); SND.sfx.tap(); });
$('#w-home').addEventListener('click', showHome);
$('#w-again').addEventListener('click', () => startLevel(G.li));
$('#w-next').addEventListener('click', () => startLevel(Math.min(G.li + 1, LEVELS.length - 1)));
let rsz = 0;
window.addEventListener('resize', () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => {
    if ($('#game').classList.contains('hidden') || !G.g) return;
    if (wantTranspose()) transpose();
    render(false);
  }, 150);
});

buildSprite();
$('#h-crown').innerHTML = art('crown');
soundIcons();
showHome();

/* debug / test hooks */
window.PM = {
  G, A, LEVELS, SONGS, SND, startLevel, findAnyPair, findPath, render, tap,
  validate() {
    const issues = [];
    for (const [id, s] of Object.entries(SONGS)) {
      try {
        const m = parseSeq(s.mel), c = parseSeq(s.chords, true);
        m.bars.forEach((b, i) => { if (Math.abs(b - s.bar) > 1e-6) issues.push(`${id} melody bar ${i + 1} = ${b}`); });
        c.bars.forEach((b, i) => { if (Math.abs(b - s.bar) > 1e-6) issues.push(`${id} chord bar ${i + 1} = ${b}`); });
        if (Math.abs(m.total - c.total) > 1e-6) issues.push(`${id} melody ${m.total} vs chords ${c.total}`);
        if (m.bars.length !== c.bars.length) issues.push(`${id} bars: melody ${m.bars.length} vs chords ${c.bars.length}`);
        compile(s);
      } catch (e) { issues.push(id + ': ' + e.message); }
    }
    return issues;
  },
  autoStep() { const p = findAnyPair(G.g, G.R, G.C); if (p) { tap(p[0][0], p[0][1]); tap(p[1][0], p[1][1]); } return !!p; }
};
})();
</script>
</body>
